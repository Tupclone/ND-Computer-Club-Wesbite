<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Notre Dame Computer Club</title>
    <link rel="stylesheet" href="style.css"> 
  </head>
  <body>
    <div id="navbar"></div>
    <div class="big-container">


    <div class="greetings">
      <h1>Welcome to Computer Club!</h1>
      <!-- todos: add a image: use<img> tag, load the image locally from the images folder at root -->
        <div class="slideshow-container">

          <div class="slide fade"> 
            <img src="/images/AI/ML/IMG_5311.JPG"> 
            <div class="caption">Caption</div>
          </div>

          <div class="slide fade"> 
            <img src="/images/AI/ML/IMG_5313.JPG"> 
            <div class="caption">Caption</div>
          </div>
          
          <div class="slide"> 
            <img src="/images/AI/ML/IMG_5314.JPG"> 
            <div class="caption">Caption</div>
          </div>

          <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
          <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <br>
        <!-- The dots/circles -->
        <div style="text-align:center">
          <span class="dot" onclick="currentSlide(1)"></span>
          <span class="dot" onclick="currentSlide(2)"></span>
          <span class="dot" onclick="currentSlide(3)"></span>
        </div>
      </div>
      <a class="interest-form" href="https://www.google.com">Interest Form</a>
    </div>

  <script src="script.js"></script>
  </body>
</html>
